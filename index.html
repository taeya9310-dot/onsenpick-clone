<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2"><meta name="description" content="일본 여행 정보">
<title>Taeya's Log — 일본을 여행하는 새로운 취향</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#202720;--muted:#777d73;--paper:#f7f6f2;--green:#315b46;--line:#e7e5dc;--lime:#dce8b9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans KR',sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 28px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:26px;font-weight:800;letter-spacing:-1.8px;color:var(--green)}.logo span{color:#a1ae7c}.nav{display:flex;gap:30px;font-size:13px;font-weight:600}.nav a:hover{color:var(--green)}.right{display:flex;align-items:center;gap:18px;font-size:13px}.login{border:1px solid #c9cec3;border-radius:30px;padding:10px 18px}
.hero{position:relative;display:flex;align-items:flex-start;width:100vw;height:calc(100vh - 76px);min-height:560px;margin-left:calc(50% - 50vw);padding:clamp(105px,19vh,150px) clamp(28px,7vw,110px) 56px;overflow:hidden;background:#263b30}.hero-photo{position:absolute;inset:0;z-index:0}.hero-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,25,18,.68),rgba(12,25,18,.18) 72%),linear-gradient(0deg,rgba(12,25,18,.35),transparent 45%)}.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}.hero-copy{position:relative;z-index:1;max-width:660px;padding:0;color:#fff}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#e2edcf;font-weight:700}.hero h1{font-size:clamp(34px,4.5vw,58px);line-height:1.2;letter-spacing:-2px;margin:12px 0 14px;font-weight:700;white-space:nowrap;color:#fff}.hero h1 em{font-style:normal;color:#dce8b9}.hero p{color:#f2f2e8;font-size:14px;margin:0}.recovery-notice{position:absolute;z-index:2;left:clamp(28px,7vw,110px);right:auto;bottom:110px;width:min(420px,calc(100% - 56px));display:flex}.recovery-notice-link{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:58px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.7);border-radius:5px;padding:13px 18px;font-size:15px;font-weight:700;backdrop-filter:blur(8px);transition:border-color .16s,color .16s}.recovery-notice-link:hover{border-color:var(--green);color:var(--green)}.recovery-notice-link span:last-child{font-size:20px;color:var(--green);font-weight:400}

section{padding:66px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.section-head small{color:var(--green);font-size:10px;letter-spacing:2px;font-weight:700}.section-head h2{font-size:29px;letter-spacing:-1px;margin:8px 0 0}.more{font-size:12px;color:var(--green);font-weight:700}
.destinations{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.destination{height:190px;position:relative;overflow:hidden;border-radius:4px;background:#aaa}.destination img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.destination:hover img{transform:scale(1.06)}.destination:after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0009)}.destination b{position:absolute;z-index:1;bottom:16px;left:16px;color:white;font-size:20px}.destination span{display:block;font-size:10px;font-weight:400;letter-spacing:1px;margin-top:3px}
.feature{background:#eeeee7}.tiles{display:grid;grid-template-columns:1fr;gap:16px}.tile{background:white;min-width:0}.tile img{width:100%;height:190px;object-fit:cover;display:block}.tile:first-child img{height:300px}.tile-body{padding:17px}.tag{font-size:10px;color:var(--green);font-weight:700;letter-spacing:1px}.tile h3{font-size:17px;margin:8px 0}.tile p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}.plan img{width:100%;height:300px;object-fit:cover}.plan h2{font-size:34px;letter-spacing:-1.5px;line-height:1.25}.plan p{color:var(--muted);line-height:1.8;font-size:14px}.plan button{background:var(--green);color:white;border:0;padding:14px 22px;border-radius:3px;margin-top:12px;cursor:pointer}
footer{background:#263b30;color:#e8eee5;padding:38px 0;font-size:12px}.foot{display:flex;justify-content:space-between;gap:20px}.foot .logo{color:white}
@media(max-width:760px){.wrap{padding:0 18px}header{height:65px}.nav{display:none}.right{gap:10px}.hero{height:calc(100svh - 65px);min-height:560px;padding:95px 22px 112px;margin-left:calc(50% - 50vw)}.hero h1{font-size:clamp(32px,8vw,42px);letter-spacing:-1.5px;white-space:normal}.hero p{font-size:13px;line-height:1.7}.recovery-notice{left:22px;right:auto;bottom:70px;width:min(390px,calc(100% - 44px))}.recovery-notice-link{min-height:54px;padding:11px 14px;font-size:14px}section{padding:48px 0}.section-head h2{font-size:24px}.tiles{grid-template-columns:1fr}.tile:first-child{grid-column:auto}.tile img,.tile:first-child img{height:170px}.plan{grid-template-columns:1fr;gap:15px}.plan img{height:220px}.plan h2{font-size:29px}.foot{flex-direction:column}}

</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="#">Taeya's Log<span>.</span></a><nav class="nav"><a href="/places.html?region=%ED%9B%97%EC%B9%B4%EC%9D%B4%EB%8F%84">여행지</a><a href="/places.html">장소 리스트</a></nav><div class="right"><span>日本を旅しよう</span></div></header>
<main>
<div class="hero">
<div class="hero-photo"><img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=2400&q=90" alt="교토의 전통 거리"></div>
<div class="hero-copy"><div class="eyebrow">YOUR JAPAN, YOUR WAY</div><h1>취향 따라<br><em>떠나는 일본 여행</em></h1><p>익숙한 도시도 새롭게. 당신의 다음 일본을 발견해 보세요.</p></div>
<section class="recovery-notice" aria-label="공지사항"><a class="recovery-notice-link" href="/recovery.html"><span>일본 여행 시 회복용 꿀템 13가지</span><span>↗</span></a></section>
</div>

</main>
</div>
</body>
</html>
