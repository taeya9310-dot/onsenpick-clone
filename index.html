<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<meta name="description" content="일본 여행 정보">
<title>일본 여행 정보 — Taeya's Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#202720;--muted:#777d73;--paper:#f7f6f2;--green:#315b46;--line:#e7e5dc}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans KR',sans-serif}
a{color:inherit;text-decoration:none}
.notice{width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 27px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px rgba(33,55,39,.06);font-size:clamp(16px,3vw,20px);font-weight:700;letter-spacing:-.4px;transition:border-color .18s,transform .18s}
.notice:hover{border-color:#9eaf9f;transform:translateY(-2px)}
.arrow{flex:0 0 auto;color:var(--green);font-size:24px;font-weight:400}
@media(max-width:560px){body{padding:17px}.notice{padding:20px 18px;font-size:16px}}
</style>
</head>
<body>
<main>
<a class="notice" href="/recovery.html" aria-label="일본 여행 시 회복용 꿀템 13가지 목록 열기">
<span>일본 여행 시 회복용 꿀템 13가지</span>
<span class="arrow" aria-hidden="true">↗</span>
</a>
</main>
</body>
</html>
