<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2"><meta name="description" content="일본의 새로운 취향을 발견하는 여행 큐레이션">
<title>tabi — 일본을 여행하는 새로운 취향</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#202720;--muted:#777d73;--paper:#f7f6f2;--green:#315b46;--line:#e7e5dc;--lime:#dce8b9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans KR',sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 28px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:26px;font-weight:800;letter-spacing:-1.8px;color:var(--green)}.logo span{color:#a1ae7c}.nav{display:flex;gap:30px;font-size:13px;font-weight:600}.nav a:hover{color:var(--green)}.right{display:flex;align-items:center;gap:18px;font-size:13px}.login{border:1px solid #c9cec3;border-radius:30px;padding:10px 18px}
.hero{padding:52px 0 34px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700}.hero h1{font-size:clamp(38px,6vw,70px);line-height:1.12;letter-spacing:-3px;margin:15px 0 14px;font-weight:700}.hero h1 em{font-style:normal;color:var(--green)}.hero p{color:var(--muted);font-size:15px;margin:0 0 28px}.hero-photo{height:390px;border-radius:5px;overflow:hidden;position:relative;background:#66715d}.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.78)}.photo-copy{position:absolute;left:42px;bottom:36px;color:white}.photo-copy small{font-size:11px;letter-spacing:2px}.photo-copy h2{font-size:32px;line-height:1.25;margin:10px 0}.photo-copy p{color:#f2f2e8;font-size:13px;margin:0}
.searchbox{position:relative;z-index:2;margin:-28px auto 0;background:white;max-width:850px;padding:13px;border-radius:5px;box-shadow:0 12px 40px #273b251a;display:flex;gap:10px}.searchbox input{border:0;outline:0;flex:1;padding:0 15px;min-width:0;font-size:14px}.searchbox button{border:0;background:var(--green);color:white;border-radius:3px;padding:15px 28px;font-weight:700;cursor:pointer}
section{padding:66px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.section-head small{color:var(--green);font-size:10px;letter-spacing:2px;font-weight:700}.section-head h2{font-size:29px;letter-spacing:-1px;margin:8px 0 0}.more{font-size:12px;color:var(--green);font-weight:700}
.destinations{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.destination{height:190px;position:relative;overflow:hidden;border-radius:4px;background:#aaa}.destination img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.destination:hover img{transform:scale(1.06)}.destination:after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0009)}.destination b{position:absolute;z-index:1;bottom:16px;left:16px;color:white;font-size:20px}.destination span{display:block;font-size:10px;font-weight:400;letter-spacing:1px;margin-top:3px}
.feature{background:#eeeee7}.tiles{display:grid;grid-template-columns:1fr;gap:16px}.tile{background:white;min-width:0}.tile img{width:100%;height:190px;object-fit:cover;display:block}.tile:first-child img{height:300px}.tile-body{padding:17px}.tag{font-size:10px;color:var(--green);font-weight:700;letter-spacing:1px}.tile h3{font-size:17px;margin:8px 0}.tile p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}.plan img{width:100%;height:300px;object-fit:cover}.plan h2{font-size:34px;letter-spacing:-1.5px;line-height:1.25}.plan p{color:var(--muted);line-height:1.8;font-size:14px}.plan button{background:var(--green);color:white;border:0;padding:14px 22px;border-radius:3px;margin-top:12px;cursor:pointer}
footer{background:#263b30;color:#e8eee5;padding:38px 0;font-size:12px}.foot{display:flex;justify-content:space-between;gap:20px}.foot .logo{color:white}
@media(max-width:760px){.wrap{padding:0 18px}header{height:65px}.nav{display:none}.right{gap:10px}.hero{padding-top:38px}.hero h1{letter-spacing:-2px}.hero-photo{height:300px}.photo-copy{left:22px;bottom:24px}.photo-copy h2{font-size:25px}.searchbox{margin:-20px 10px 0;padding:8px}.searchbox button{padding:13px 16px}.destinations{grid-template-columns:repeat(2,1fr)}.destination{height:155px}.destination:last-child{display:block}section{padding:48px 0}.section-head h2{font-size:24px}.tiles{grid-template-columns:1fr}.tile:first-child{grid-column:auto}.tile img,.tile:first-child img{height:170px}.plan{grid-template-columns:1fr;gap:15px}.plan img{height:220px}.plan h2{font-size:29px}.foot{flex-direction:column}}

/* Recovery notice link */
.recovery-notice{padding:0 0 42px}
.recovery-notice-link{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:20px 22px;font-size:16px;font-weight:700}
.recovery-notice-link:hover{border-color:var(--green);color:var(--green)}
.recovery-notice-link span:last-child{font-size:20px;color:var(--green);font-weight:400}
@media(max-width:760px){.recovery-notice{padding-bottom:26px}.recovery-notice-link{padding:17px;font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="#">tabi<span>.</span></a><nav class="nav"><a href="/places.html?region=%ED%9B%97%EC%B9%B4%EC%9D%B4%EB%8F%84">여행지</a><a href="/places.html">장소 리스트</a><a href="/kurokawa-onsen.html">구로카와 온천</a></nav><div class="right"><span>日本を旅しよう</span></div></header>
<main>
<div class="hero"><div class="eyebrow">YOUR JAPAN, YOUR WAY</div><h1>취향 따라 떠나는<br><em>나만의 일본 여행</em></h1><p>익숙한 도시도 새롭게. 당신의 다음 일본을 발견해 보세요.</p>
<div class="hero-photo"><img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1800&q=85" alt="교토의 전통 거리"><div class="photo-copy"><small>JAPAN, BEYOND THE ORDINARY</small><h2>골목 끝에서 만나는<br>새로운 일본</h2><p>여행자의 시선으로 발견한 일본의 순간들</p></div></div>
<div class="searchbox"><input id="search" placeholder="지역을 입력하세요. 예: 후쿠오카, 오키나와, 마쓰야마" onkeydown="if(event.key===&quot;Enter&quot;)searchPlace()"><button onclick="searchPlace()">여행지 찾기 ↗</button></div>
</div>

<section class="recovery-notice" aria-label="공지사항">
<a class="recovery-notice-link" href="/recovery.html"><span>일본 여행 시 회복용 꿀템 13가지</span><span>↗</span></a>
</section>
<script>
async function searchPlace(){
 const input=document.getElementById('search');
 const query=input.value.trim();
 if(!query){input.focus();return}
 try{
  const response=await fetch('/api/places',{cache:'no-store'});
  if(!response.ok) throw new Error('region api unavailable');
  const data=await response.json();
  const places=Array.isArray(data.places)?data.places:[];
  const regions=[...new Set(places.map(p=>p.region).filter(Boolean))];
  const q=query.replace(/\s+/g,'').toLowerCase();
  const matches=regions.filter(r=>r.replace(/\s+/g,'').toLowerCase()===q);
  if(matches.length===1){location.href='/places.html?region='+encodeURIComponent(matches[0]);return}
  location.href='/places.html?q='+encodeURIComponent(query);
 }catch(error){location.href='/places.html?q='+encodeURIComponent(query)}
}
</script>
</main>
</div>
</body>
</html>
