function syncRegionChips(){document.querySelectorAll('#regionChips .chip').forEach(x=>x.classList.toggle('active',x.dataset.region===$('region').value));renderRegionCategoryChips()}
syncRegionChips();
$('regionChips').addEventListener('click',e=>{const b=e.target.closest('button[data-region]');if(!b)return;$('region').value=b.dataset.region;$('category').value='';syncRegionChips();render()});
$('regionCategoryChips').addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(!b)return;$('category').value=$('category').value===b.dataset.category?'':b.dataset.category;renderRegionCategoryChips();render()});
$('region').addEventListener('change',()=>{syncRegionChips();$('category').value='';render()});
$('category').addEventListener('change',renderRegionCategoryChips);renderRegionCategoryChips();render();
</script></body></html>
