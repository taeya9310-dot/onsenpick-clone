:"하카타 포트 타워 (타워)","region":"후쿠오카","category":"관광지","note":"","map":"https://www.google.com/maps/place/%ED%95%98%EC%B9%B4%ED%83%80+%ED%8F%AC%ED%8A%B8+%ED%83%80%EC%9B%8C/data=!4m2!3m1!1s0x354191f10ea131ad:0xe61ba129e5877ff9","notion":"https://app.notion.com/p/4168c7eae0ca8170ad8ac0a452d59f57","photo":"","tags":[],"saved":"2026-10-28"},{"name":"후쿠오카 타워 (타워)","region":"후쿠오카","category":"관광지","note":"","map":"https://www.google.com/maps/place/%ED%9B%84%EC%BF%A0%EC%98%A4%EC%B9%B4+%ED%83%80%EC%9B%8C/data=!4m2!3m1!1s0x354193aa23040001:0xf9743b36617a912d","notion":"https://app.notion.com/p/4168c7eae0ca81538541f3a85fd06a23","photo":"","tags":[],"saved":"2026-10-28"},{"name":"미나 텐진","region":"후쿠오카","category":"쇼핑","note":"복잡한 돈키호테 대신 쾌적하게 의류, 문구, 주방용품 쇼핑하기 좋은 곳. (유니클로, GU, 로프트 입점)","map":"https://www.google.com/maps/place/%EB%AF%B8%EB%82%98+%ED%85%90%EC%A7%84/data=!4m2!3m1!1s0x3541918e7beb23b5:0xfa501c2d5ea93026","notion":"https://app.notion.com/p/4168c7eae0ca8172a1a4df29bed052a0","photo":"","tags":[],"saved":"2026-10-28"},{"name":"야마야 다이묘점","region":"후쿠오카","category":"쇼핑","note":"후쿠오카 리쿼샵_가장 저렴하다고 알려진곳","map":"https://www.google.com/maps/place/%EC%95%BC%EB%A7%88%EC%95%BC+%EB%8B%A4%EC%9D%B4%EB%AC%98%EC%A0%90/data=!4m2!3m1!1s0x35419186cda68693:0xe92569f86a5d0381","notion":"https://app.notion.com/p/4168c7eae0ca812698d2d50d8c3d5233","photo":"","tags":[],"saved":"2026-10-28"}];const $=id=>document.getElementById(id);const regions=[...new Set(places.map(p=>p.region))].sort((a,b)=>a.localeCompare(b,'ko'));const categories=[...new Set(places.map(p=>p.category))].sort((a,b)=>a.localeCompare(b,'ko'));
$('totalCount').textContent=places.length;$('regionCount').textContent=regions.length;$('categoryCount').textContent=categories.length;
for(const v of regions){const o=document.createElement('option');o.value=v;o.textContent=v;$('region').append(o)}
for(const v of categories){const o=document.createElement('option');o.value=v;o.textContent=v.replaceAll('_',' ');$('category').append(o)}
function render(){const q=$('q').value.trim().toLowerCase(),r=$('region').value,c=$('category').value,s=$('sort').value;let rows=places.filter(p=>(!r||p.region===r)&&(!c||p.category===c)&&(!q||[p.name,p.region,p.category,p.note,...p.tags].join(' ').toLowerCase().includes(q)));rows.sort((a,b)=>s==='name'?a.name.localeCompare(b.name,'ko'):s==='new'?(b.saved||'').localeCompare(a.saved||''):a.region.localeCompare(b.region,'ko')||a.category.localeCompare(b.category,'ko')||a.name.localeCompare(b.name,'ko'));$('resultCount').textContent=rows.length.toLocaleString()+'곳';$('grid').innerHTML='';if(!rows.length){$('grid').innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}for(const p of rows){const el=document.createElement('article');el.className='item';const tags=p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('');el.innerHTML='<div class="meta">'+esc(p.region)+' · '+esc(p.category.replaceAll('_',' '))+'</div><h3>'+esc(p.name)+'</h3>'+(p.note?'<p>'+esc(p.note)+'</p>':'<p></p>')+'<div class="tags">'+tags+'</div><div class="links">'+(p.map?'<a href="'+esc(p.map)+'" target="_blank" rel="noopener">구글 지도 ↗</a>':'')+(p.notion?'<a href="'+esc(p.notion)+'" target="_blank" rel="noopener">노션 원문 ↗</a>':'')+'</div>'; $('grid').append(el)}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
['q','region','category','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
$('regionChips').innerHTML='<button class="chip active" data-region="">전체</button>'+regions.map(r=>'<button class="chip" data-region="'+esc(r)+'">'+esc(r)+'</button>').join('');
$('regionChips').addEventListener('click',e=>{const b=e.target.closest('button[data-region]');if(!b)return;$('region').value=b.dataset.region;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('region').addEventListener('change',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.region===$('region').value));});render();
